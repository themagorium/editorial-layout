<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The Magorium</title>
  <desc id="desc">The Magorium purple-blue and gold M insignia.</desc>
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#272c7e" />
      <stop offset="55%" stop-color="#3147b7" />
      <stop offset="100%" stop-color="#4a61d6" />
    </linearGradient>
    <linearGradient id="gold-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8e7a3" />
      <stop offset="45%" stop-color="#d9b55a" />
      <stop offset="100%" stop-color="#9f7a2b" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#101327" />
  <rect x="58" y="58" width="1084" height="514" rx="28" fill="url(#bg-gradient)" stroke="#d9b55a" stroke-width="4" />
  <g transform="translate(0 6)">
    <text x="600" y="312" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="220" font-weight="700" fill="url(#gold-gradient)">
      M
    </text>
    <text x="600" y="314" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="220" font-weight="700" fill="none" stroke="#f3dd8f" stroke-width="2">
      M
    </text>
  </g>
  <text x="600" y="430" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="54" letter-spacing="4" fill="#ffffff">
    THE MAGORIUM
  </text>
  <text x="600" y="475" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="5" fill="#f6e8b8">
    CURATED EDITORIAL
  </text>
</svg>
