<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The Magorium</title>
  <desc id="desc">The Magorium wordmark on a clean background.</desc>
  <rect width="1200" height="630" fill="#f8f8f6" />
  <rect x="60" y="60" width="1080" height="510" rx="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="3" />
  <text x="600" y="285" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#111111" letter-spacing="2">
    THE MAGORIUM
  </text>
  <text x="600" y="360" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#333333" letter-spacing="6">
